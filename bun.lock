{
  "lockfileVersion": 1,
  "configVersion": 1,
  "workspaces": {
    "": {
      "name": "gloves-workspace",
    },
    "packages/gloves-adapter-core": {
      "name": "@gloves/adapter-core",
      "version": "0.1.0",
    },
    "packages/gloves-client": {
      "name": "@gloves/client",
      "version": "0.1.0",
    },
    "packages/gloves-openclaw": {
      "name": "@gloves/openclaw",
      "version": "0.1.0",
      "dependencies": {
        "@gloves/adapter-core": "workspace:*",
        "@gloves/client": "workspace:*",
      },
    },
    "packages/openclaw-gloves": {
      "name": "@openclaw/gloves",
      "version": "0.1.0",
