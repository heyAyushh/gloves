    },
  },
  "packages": {
    "@gloves/adapter-core": ["@gloves/adapter-core@workspace:packages/gloves-adapter-core"],

    "@gloves/client": ["@gloves/client@workspace:packages/gloves-client"],

    "@gloves/openclaw": ["@gloves/openclaw@workspace:packages/gloves-openclaw"],

